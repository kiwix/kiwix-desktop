name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  Windows:
    strategy:
      fail-fast: false
      matrix:
        config:
          - native_mixed
    runs-on: windows-2025
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install packages
      run: |
        choco.exe install pkgconfiglite

    - name: Install QT
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        modules: "qtwebengine qtwebchannel qtpositioning"
        setup-python: false

    - name: Setup MSVC compiler
      uses: bus1/cabuild/action/msdevshell@v1
      with:
        architecture: x64

    - name: Install dependencies
      uses: kiwix/kiwix-build/actions/dl_deps_archive@main
      with:
        target_platform: win-x86_64-mixed

    - name: Compile
      shell: cmd
      run: |
        set PKG_CONFIG_PATH=%cd%\BUILD_win-amd64\INSTALL\lib\pkgconfig
        qmake --version
        qmake PREFIX=%cd%\BUILD_win-amd64\INSTALL
        nmake release-all

    - name: Package Windows archive
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $appExe = Get-ChildItem -Path . -Filter kiwix-desktop.exe -Recurse |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $appExe) {
          throw "Compiled kiwix-desktop.exe was not found"
        }
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        & .\scripts\package-windows.ps1 -AppExe $appExe -OutDir dist -ArchiveName kiwix-desktop.zip

    - name: Test Windows package structure
      shell: pwsh
      run: |
        & .\scripts\test-windows-package.ps1 -PackageDir dist\Kiwix

    - uses: actions/upload-artifact@v4
      with:
        name: Windows portable archive
        path: dist\kiwix-desktop.zip

  Linux:
    strategy:
      fail-fast: false
      matrix:
        image_variant: [jammy]
    env:
      HOME: /home/runner
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kiwix/kiwix-build_ci_${{matrix.image_variant}}:2026-07-22

    steps:
      - name: Install dependencies
        uses: kiwix/kiwix-build/actions/dl_deps_archive@main
        with:
          target_platform: linux-x86_64-dyn

      - name: Install QT
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: "linux"
          target: "desktop"
          dir: /home/runner
          modules: "qtwebengine qtwebchannel qtpositioning qtserialport"
          install-deps: false
          setup-python: false
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/configs/aqt.ini

      - name: Retrieve source code
        uses: actions/checkout@v6

      - name: Compile source code
        shell: bash
        env:
          PKG_CONFIG_PATH: "/home/runner/BUILD_linux-x86_64/INSTALL/lib/pkgconfig:/home/runner/BUILD_linux-x86_64/INSTALL/lib/x86_64-linux-gnu/pkgconfig"
        run: |
          PATH=/home/runner/Qt/6.8.3/gcc_64/bin:$PATH
          qmake --version
          qmake PREFIX=$HOME/BUILD_linux-x86_64/INSTALL
          make
